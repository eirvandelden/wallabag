service: wallabag
image: wallabag/wallabag:latest
servers:
  web:
    hosts:
      - 192.168.1.216

proxy:
  ssl: false
  hosts:
    - readlater.vandelden.family

registry:
  username: eirvandelden
  password: 

builder:
  arch: amd64
  remote: ssh://root@192.168.1.128
  local: false
  context: "."

env:
  clear:
    SYMFONY__ENV__DATABASE_DRIVER: pdo_mysql
    SYMFONY__ENV__DATABASE_HOST: db
    SYMFONY__ENV__DATABASE_PORT: "3306"
    SYMFONY__ENV__DATABASE_NAME: wallabag
    SYMFONY__ENV__DATABASE_USER: wallabag
    SYMFONY__ENV__DATABASE_PASSWORD: wallabagpass
    SYMFONY__ENV__DOMAIN_NAME: https://readlater.vandelden.family

volumes:
  - /home/app_storage/wallabag_uploads:/var/www/wallabag/web/assets/images

accessories:
  db:
    image: mariadb
    host: 192.168.1.216
    port: 3306
    env:
      clear:
        MYSQL_ROOT_PASSWORD: wallabagroot
        MYSQL_DATABASE: wallabag
        MYSQL_USER: wallabag
        MYSQL_PASSWORD: wallabagpass
    volumes:
      - /home/app_storage/wallabag/db:/var/lib/mysql
